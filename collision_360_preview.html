<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>360° 자동차 충돌 접근 방향 — 인터랙티브 미리보기</title>
<style>
body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f5f8fc;color:#17324f}
.shell{max-width:920px;margin:24px auto;padding:30px;background:white;border-radius:20px;box-shadow:0 12px 50px #1933510b}
h1{font-size:25px;margin:0 0 5px}p{color:#697d93;margin:8px 0 20px;line-height:1.55}
.row{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center}
svg{width:100%;height:auto;background:#f9fbfe;border:1px solid #e4edf7;border-radius:15px;touch-action:none;cursor:crosshair}
.panel{border:1px solid #e4edf7;border-radius:15px;padding:21px}
.count{font-size:42px;font-weight:800;color:#2563eb}
input[type=range]{width:100%;accent-color:#2563eb;height:34px}
.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
button{background:#eff5fe;border:1px solid #d9e7f7;color:#2456a4;border-radius:8px;padding:9px 11px;cursor:pointer;font-weight:600}
button:hover{background:#dce9fe}button.run{background:#2563eb;color:#fff}
small{display:block;color:#7e91a6;margin-top:14px}
@media(max-width:700px){.row{grid-template-columns:1fr}.shell{margin:8px;padding:15px}h1{font-size:21px}}
</style></head><body><div class="shell">
<h1>자동차 2대의 충돌 접근 방향을 360°로 선택</h1>
<p>원형 다이얼의 아무 지점을 <b>클릭하거나 드래그</b>해 각도를 선택할 수 있습니다. 두 번째 차량이 그 방향에서 접근합니다.</p>
<div class="row">
<svg id="scene" viewBox="0 0 520 520" role="img" aria-label="360도 회전하는 두 자동차 충돌 방향 선택기">
<defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".13"/></filter></defs>
<circle cx="260" cy="260" r="180" stroke="#d6e5f6" fill="none" stroke-width="2" stroke-dasharray="5 8"/>
<circle cx="260" cy="260" r="221" stroke="#e5edf7" fill="none" stroke-width="1"/>
<line x1="260" y1="25" x2="260" y2="495" stroke="#e7eef8" stroke-width="1"/>
<line x1="25" y1="260" x2="495" y2="260" stroke="#e7eef8" stroke-width="1"/>
<g fill="#8299b3" font-size="13" text-anchor="middle"><text x="260" y="23">0° 전방</text><text x="475" y="248">90°</text><text x="260" y="506">180° 후방</text><text x="40" y="248">270°</text></g>
<line id="vector" x1="260" y1="260" x2="260" y2="40" stroke="#ea8d48" stroke-width="3" stroke-dasharray="7 7"/>
<g transform="translate(260 260)" filter="url(#shadow)">
<rect x="-36" y="-69" width="72" height="138" rx="16" fill="#9fb6cc" stroke="#17324f" stroke-width="3"/>
<rect x="-29" y="-19" width="58" height="64" rx="8" fill="#c6e5f7" stroke="#557f9c"/>
<rect x="-29" y="-61" width="58" height="33" rx="7" fill="#9dccea"/>
<rect x="-30" y="-65" width="60" height="6" rx="2" fill="#f2e2b5"/>
</g>
<g id="other" transform="translate(260 48) rotate(180)" filter="url(#shadow)">
<rect x="-36" y="-69" width="72" height="138" rx="16" fill="#2563eb" stroke="#17324f" stroke-width="3"/>
<rect x="-29" y="-19" width="58" height="64" rx="8" fill="#c6e5f7" stroke="#557f9c"/>
<rect x="-29" y="-61" width="58" height="33" rx="7" fill="#9dccea"/>
<rect x="-30" y="-65" width="60" height="6" rx="2" fill="#f2e2b5"/>
</g>
<circle id="handle" cx="260" cy="48" r="13" fill="#ea8d48" stroke="white" stroke-width="4"/>
<circle cx="260" cy="260" r="180" fill="transparent" stroke="transparent" stroke-width="0"/>
</svg>
<div class="panel">
<div style="font-weight:700">선택된 접근 방향</div><div class="count" id="count">45°</div><div id="type" style="color:#527094;font-weight:700">사선충돌 · 45° 부근</div>
<label for="angle" style="display:block;margin-top:24px;font-weight:700">충돌각 (°)</label>
<input type="range" id="angle" min="0" max="359" value="45" step="1"/>
<div class="buttons"><button data-a="0">정면 0°</button><button data-a="45">사선 45°</button><button data-a="90">측면 90°</button><button data-a="180">후방 180°</button><button data-a="270">좌측 270°</button><button class="run" id="play">▶ 접근 보기</button></div>
<small>이 HTML은 방향 선택기의 독립 미리보기입니다. Streamlit 본체에서는 위젯의 선택 각도가 시나리오와 연결됩니다. 자동차 애니메이션은 물리 시뮬레이션이 아닙니다.</small>
</div></div></div>
<script>
const svg=document.getElementById('scene'),slider=document.getElementById('angle'),moving=document.getElementById('other'),vector=document.getElementById('vector'),handle=document.getElementById('handle');
let angle=45, radius=212,playing=false;
function category(a){let v=Math.min(a,360-a);if(v<=20)return '전방';if(v<=65)return '사선';if(v<=120)return '측면';return '후방·측후방';}
function paint(){let r=angle*Math.PI/180;let x=260+radius*Math.sin(r),y=260-radius*Math.cos(r);
moving.setAttribute('transform',`translate(${x} ${y}) rotate(${angle+180})`);
vector.setAttribute('x2',x);vector.setAttribute('y2',y);handle.setAttribute('cx',x);handle.setAttribute('cy',y);
document.getElementById('count').textContent=angle+'°';document.getElementById('type').textContent=category(angle)+' 접근';slider.value=angle;}
function set(a){angle=((Math.round(a)%360)+360)%360;paint();}
function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();if(!m)return;const z=p.matrixTransform(m.inverse());set(Math.atan2(z.x-260,260-z.y)*180/Math.PI);}
let down=false;svg.addEventListener('pointerdown',e=>{down=true;svg.setPointerCapture(e.pointerId);point(e)});
svg.addEventListener('pointermove',e=>{if(down&&!playing)point(e)});
svg.addEventListener('pointerup',()=>{down=false});slider.addEventListener('input',e=>set(+e.target.value));
document.querySelectorAll('[data-a]').forEach(x=>x.addEventListener('click',()=>set(+x.dataset.a)));
document.getElementById('play').addEventListener('click',()=>{if(playing)return;playing=true;const start=performance.now();
function tick(t){let q=Math.min((t-start)/1050,1);radius=212-110*(1-Math.pow(1-q,2));paint();if(q<1)requestAnimationFrame(tick);else setTimeout(()=>{radius=212;playing=false;paint()},450)} requestAnimationFrame(tick)});
paint();
</script></body></html>
